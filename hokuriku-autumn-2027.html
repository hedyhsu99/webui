<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 秋季 富山・飛驒・金澤 7天6夜</title>
<script>if(window.self!==window.top)document.documentElement.classList.add("embedded");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef0ec; --card:#f8f9f6; --ink:#1f2a36; --muted:#5b6671; --line:#d2d8d1;
  --momiji:#b3362b; --momiji-soft:#f3dcd7; --gold:#b98f2e; --moss:#4d6a4c; --area:#dfe5dc;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141a20; --card:#1b232b; --ink:#e5e9e3; --muted:#9ba6ae; --line:#2c363f;
    --momiji:#e2654f; --momiji-soft:#3a2522; --gold:#d8b45a; --moss:#90b08c; --area:#1f2a31;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141a20; --card:#1b232b; --ink:#e5e9e3; --muted:#9ba6ae; --line:#2c363f;
  --momiji:#e2654f; --momiji-soft:#3a2522; --gold:#d8b45a; --moss:#90b08c; --area:#1f2a31;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--momiji);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* 回首頁連結 */
.back{display:inline-block;margin-top:20px;font-size:.9rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--momiji)}
/* 嵌在首頁（iframe）裡時已經在首頁上，不需要回首頁連結 */
.embedded .back{display:none}
.embedded .hero{padding-top:8px}
/* 點天數時捲到當天內容；嵌在首頁時頂端有固定資訊列（約 64px），要留出這段不然會被蓋住 */
#panel{scroll-margin-top:8px}
.embedded #panel{scroll-margin-top:76px}
/* 本機開檔無法自動撐高、只能框內捲動時，捲軸改成細的 */
html.embedded{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* Hero */
.hero{padding:20px 0 8px}
.hero h1{font-family:var(--kai);font-weight:700;font-size:clamp(2rem,6vw,3.4rem);line-height:1.2;margin:0 0 10px;letter-spacing:.02em}
.hero p{margin:0;color:var(--muted);max-width:40em}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 12px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.chip b{color:var(--ink);font-weight:700}

/* Profile */
.profile{margin:22px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.profile svg{display:block;width:100%;min-width:760px;height:auto}
.band{fill:transparent;cursor:pointer}
.band:hover{fill:var(--area);opacity:.55}
.band.on{fill:var(--momiji-soft);opacity:.8}
.area{fill:var(--area)}
.ridge{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.node{fill:var(--card);stroke:var(--ink);stroke-width:2;pointer-events:none}
.node.on{fill:var(--momiji);stroke:var(--momiji)}
.lbl{font-family:var(--sans);font-size:13px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.alt{font-size:11px;fill:var(--muted)}
.lbl.on{fill:var(--momiji);font-weight:700}
.daynum{font-family:var(--kai);font-size:15px;fill:var(--muted);text-anchor:middle;pointer-events:none}
.daynum.on{fill:var(--momiji);font-weight:700}
.peak{font-family:var(--kai);font-size:14px;fill:var(--momiji)}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}

/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left;line-height:1.3}
.tab small{display:block;color:var(--muted);font-size:.75rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--paper);opacity:.75}

/* Day panel */
.day{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;padding:26px 0 40px}
@media (max-width:820px){.day{grid-template-columns:1fr;gap:24px}}
.dayhead{grid-column:1/-1;display:flex;gap:16px;align-items:flex-start}
.dayhead .emo{font-size:2.4rem;line-height:1}
.dayhead h2{font-family:var(--kai);font-size:clamp(1.5rem,4vw,2.1rem);margin:0;line-height:1.25}
.dayhead p{margin:4px 0 0;color:var(--muted)}
h3{font-family:var(--kai);font-size:1.2rem;margin:0 0 12px;font-weight:700}

.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:28px 1fr;gap:14px;padding:0 0 18px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;position:relative;z-index:1}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-pressed="true"]{background:var(--moss);border-color:var(--moss)}
.check[aria-pressed="true"] svg{opacity:1}
.step .t{font-weight:500}
.step.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--moss)}
.step .n{font-size:.9rem;color:var(--muted);margin-top:2px}
.step .time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--momiji);margin-right:8px}
.stay{display:inline-block;margin-top:8px!important;color:var(--ink)!important;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:.9rem}
.step .opt{font-size:.75rem;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.maplink{font-size:.82rem;color:var(--muted);text-underline-offset:3px}
.maplink:hover{color:var(--momiji)}

.tip{margin-top:6px;border-left:3px solid var(--gold);padding:10px 14px;background:var(--card);border-radius:0 8px 8px 0;font-size:.93rem}
.tip strong{font-family:var(--kai)}

.foods{display:flex;flex-direction:column;gap:14px}
.food{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;position:relative}
.food.liked{border-color:var(--momiji)}
.food h4{margin:0;font-size:1.05rem;padding-right:84px;line-height:1.4}
.food .jp{color:var(--muted);font-size:.85rem}
.food p{margin:8px 0 6px;font-size:.93rem}
.like{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px 3px 8px;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:4px}
.like svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.like[aria-pressed="true"]{background:var(--momiji);border-color:var(--momiji);color:#fff}
.like[aria-pressed="true"] svg{fill:currentColor}
.like:disabled{opacity:.6;cursor:default}
.wants{font-size:.8rem;color:var(--momiji);font-weight:500;margin-top:2px}
.wants[hidden]{display:none}

.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:18px 0 0;grid-column:1/-1}
.pager button{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}

/* Wishlist */
.wish{border-top:2px solid var(--ink);padding:26px 0 56px}
.wish h2{font-family:var(--kai);margin:0 0 4px;font-size:1.6rem}
.wish>p{margin:0 0 14px;color:var(--muted)}
.wishlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wishlist button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.wishlist small{display:block;color:var(--muted)}
.wishlist .cnt{float:right;color:var(--momiji);font-weight:700;font-variant-numeric:tabular-nums}
.wishlist .mine{color:var(--momiji)}
.wishlist .who{color:var(--ink);opacity:.75;margin-top:2px}
.wishlist .hot{border-color:var(--momiji);background:var(--momiji-soft)}
.wishmeta{margin:0 0 12px;font-size:.85rem;color:var(--muted)}
.wishmeta:empty{display:none}
.rename{background:none;border:none;padding:0;font:inherit;color:var(--momiji);text-decoration:underline;cursor:pointer}
.reset{margin-top:18px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}

@media (prefers-reduced-motion:no-preference){
  .day{animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>

</div>

     {t:"晚上回飯店打包", n:"新制免稅不需密封"}
   ],
   foods:[
     {name:"近江町市場 海鮮丼", jp:"豪華海鮮丼", d:"鮭魚卵、海膽、甜蝦多到溢出碗外，痛風級美味。", q:"近江町市場 海鮮丼"},
     {name:"炙燒紅喉魚", jp:"のどぐろ", d:"北陸的高級白肉魚，炙燒後油脂香甜。", q:"近江町市場 のどぐろ"}
   ]},
 { emo:"✈️", city:"小松", title:"小松機場退稅，快樂返台", sub:"機場大巴 40 分鐘",
   stops:[{name:"小松機場",alt:10}],
   steps:[
     {t:"搭機場大巴到小松機場", n:"約 40 分鐘", q:"金沢駅 空港バス"},
     {t:"抵達後先不要托運行李", q:"小松空港"},
     {t:"帶免稅品與護照到海關／KIOSK 退稅機台掃描", n:"小松機場人少，查驗速度快"},
     {t:"確認退稅款", n:"退回信用卡或領現金"},
     {t:"辦理行李托運"},
     {t:"搭虎航回台 🎉"}
   ],
   foods:[]}
];

const KEY="hokuriku2027-v2";
let store={done:{},like:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.done&&s.like) store=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
// store.done（行程勾選）是個人進度，只存這台裝置；store.like 是舊版個人想吃紀錄，已改為下方大家共用的「想吃」，不再使用

/* ---------- 想吃（大家共用，存在 Firebase） ----------
 * 讀寫、即時更新、名字管理、失敗還原都由共用的 counter.js（Counter.roster）處理，這裡只負責畫面。
 * Firebase：/wantBy/hokuriku-autumn-2027/d{第幾天}f{第幾家}/{名字} = true；人數＝名單長度
 * （舊版只記人數的 /wants 已停用）
 * ⚠️ key 用「第幾天第幾家」的位置編號：之後調整 DAYS 裡美食的順序，人數會跑到別家店上。新增店家請加在該天最後面
 */
const TRIP_ID="hokuriku-autumn-2027";
const fk=(di,fi)=>`d${di}f${fi}`;

let cur=0;
const mapURL=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Elevation profile ---------- */
function buildProfile(){
  const W=1000,H=270,pl=40,pr=40,top=58,base=212;
  const pts=[]; DAYS.forEach((d,di)=>d.stops.forEach(s=>pts.push({...s,di})));
  const step=(W-pl-pr)/(pts.length-1), maxA=3200;
  pts.forEach((p,i)=>{p.x=pl+i*step;p.y=base-(p.alt/maxA)*(base-top);});
  // smooth path (Catmull-Rom → Bezier)
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C${c1x},${Math.min(c1y,base)} ${c2x},${Math.min(c2y,base)} ${p2.x},${p2.y}`;
  }
  const area=d+` L${pts.at(-1).x},${H-24} L${pts[0].x},${H-24} Z`;
  let bands="",nums="";
  DAYS.forEach((_,di)=>{
    const idx=pts.map((p,i)=>p.di===di?i:-1).filter(i=>i>=0);
    const a=idx[0],b=idx.at(-1);
    const x0=a===0?0:(pts[a].x+pts[a-1].x)/2, x1=b===pts.length-1?W:(pts[b].x+pts[b+1].x)/2;
    bands+=`<rect class="band" data-day="${di}" x="${x0}" y="0" width="${x1-x0}" height="${H}" rx="10"><title>Day ${di+1} ${DAYS[di].city}</title></rect>`;
    nums+=`<text class="daynum" data-day="${di}" x="${(x0+x1)/2}" y="${H-6}">Day ${di+1}</text>`;
  });
  const nodes=pts.map(p=>`<circle class="node" data-day="${p.di}" cx="${p.x}" cy="${p.y}" r="6"/>
    <text class="lbl" data-day="${p.di}" x="${p.x}" y="${p.y-26}">${p.name}</text>
    <text class="lbl alt" data-day="${p.di}" x="${p.x}" y="${p.y-12}">${p.alt.toLocaleString()}m</text>`).join("");
  document.getElementById("profile").innerHTML=
   `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各站海拔：富山 10 公尺，最高乘鞍岳劍峰 3,026 公尺，最後到小松機場">
     ${bands}<path class="area" d="${area}"/><path class="ridge" d="${d}"/>
     <line x1="0" x2="${W}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
     ${nodes}${nums}</svg>`;
  document.querySelectorAll(".band").forEach(r=>r.addEventListener("click",()=>go(+r.dataset.day,true)));
}

/* ---------- Tabs ---------- */
function buildTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML=DAYS.map((d,i)=>`<button class="tab" role="tab" id="tab${i}" aria-controls="panel" data-i="${i}">Day ${i+1}<small>${d.city}</small></button>`).join("");
  t.addEventListener("click",e=>{const b=e.target.closest(".tab"); if(b) go(+b.dataset.i,true);});   // 分頁列在頁首、內容在海拔圖下方，點了要捲過去才看得到
  t.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
      e.preventDefault(); go((cur+(e.key==="ArrowRight"?1:-1)+DAYS.length)%DAYS.length);
      document.getElementById("tab"+cur).focus();
    }
  });
}

const checkSVG=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const heartSVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`;

function renderDay(){
  const d=DAYS[cur], p=document.getElementById("panel");
  p.setAttribute("aria-labelledby","tab"+cur);
  const steps=d.steps.map((s,i)=>{
    const k=cur+"-"+i, on=!!store.done[k];
    return `<li class="step${on?" done":""}">
      <button class="check" data-k="${k}" aria-pressed="${on}" aria-label="標記完成：${esc(s.t)}">${checkSVG}</button>
      <div><div class="t">${s.time?`<span class="time">${s.time}</span>`:""}${esc(s.t)}${s.opt?'<span class="opt">選配</span>':""}</div>
      ${s.n?`<div class="n">${esc(s.n)}</div>`:""}
      ${s.q?`<a class="maplink" href="${mapURL(s.q)}" target="_blank" rel="noopener">在地圖上查看</a>`:""}</div></li>`;
  }).join("");
  const foods=d.foods.length?d.foods.map((f,i)=>{
    const k=fk(cur,i);
    return `<article class="food" data-k="${k}">
      <h4>${esc(f.name)}</h4><div class="jp">${esc(f.jp)}</div>
      <div class="wants" data-k="${k}" hidden></div>
      <p>${esc(f.d)}</p>
      <a class="maplink" href="${mapURL(f.q)}" target="_blank" rel="noopener">在地圖上查看</a>
      <button class="like" data-k="${k}" aria-pressed="false">${heartSVG}<span class="lt">想吃</span></button></article>`;
  }).join(""):`<div class="tip"><strong>小松機場退稅的好處</strong><br>機場人少，海關查驗快、幾乎不用排隊。記得先退稅、再托運。</div>`;
  p.innerHTML=`<section class="day">
    <div class="dayhead"><div class="emo" aria-hidden="true">${d.emo}</div>
      <div><h2>Day ${cur+1}　${esc(d.title)}</h2><p>${esc(d.sub)}</p>${d.stay?`<p class="stay">住宿：${esc(d.stay)}</p>`:""}</div></div>
    <div><h3>行程</h3><ol class="steps">${steps}</ol>
      ${d.tip?`<div class="tip"><strong>${esc(d.tip.h)}</strong><br>${esc(d.tip.b)}</div>`:""}</div>
    <div><h3>${d.foods.length?"在地美食":"出發前提醒"}</h3><div class="foods">${foods}</div></div>
    <div class="pager">
      <button id="prev" ${cur===0?"disabled":""}>上一天</button>
      <button id="next" ${cur===DAYS.length-1?"disabled":""}>下一天</button>
    </div></section>`;
  p.querySelectorAll(".check").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k; store.done[k]=!store.done[k]; if(!store.done[k]) delete store.done[k];
    save(); renderDay(); updateStats(); p.querySelector(`.check[data-k="${k}"]`).focus();
  }));
  p.querySelectorAll(".like").forEach(b=>b.addEventListener("click",()=>toggleWant(b.dataset.k)));
  paintWants();
  document.getElementById("prev").onclick=()=>go(cur-1,true);
  document.getElementById("next").onclick=()=>go(cur+1,true);
}

function highlight(){
  document.querySelectorAll("[data-day]").forEach(el=>el.classList.toggle("on",+el.dataset.day===cur));
  document.querySelectorAll(".tab").forEach((t,i)=>{t.setAttribute("aria-selected",i===cur);t.tabIndex=i===cur?0:-1;});
  // 只橫向捲動分頁列讓選中的那天露出來；不用 scrollIntoView，
  // 否則嵌在首頁時會連外層頁面一起垂直捲動，載入時畫面亂跳
  const bar=document.getElementById("tabs"), t=document.getElementById("tab"+cur);
  const b=bar.getBoundingClientRect(), r=t.getBoundingClientRect();
  if(r.left<b.left) bar.scrollLeft-=b.left-r.left+8;
  else if(r.right>b.right) bar.scrollLeft+=r.right-b.right+8;
}

function updateStats(){
  const total=DAYS.reduce((n,d)=>n+d.steps.length,0);
  document.getElementById("stepTotal").textContent=total;
  document.getElementById("doneCount").textContent=Object.keys(store.done).length;
  document.getElementById("likeCount").textContent=wants.keys().filter(k=>wants.count(k)>0).length;
}

/* 🔥 人氣店：想吃的人「超過參與人數的一半」，而且至少 2 人。
 * 參與人數＝在這一部作品按過任何一家想吃的所有人（不需要另外設定全班人數）。
 * 至少 2 人是為了避免剛開始只有 1 人參與時，他按的每一家都變成人氣店 */
const isHot=k=>{const n=wants.count(k); return n>=2 && n>wants.people().length/2;};

// 大家的想吃清單：有人想吃的店，依人數多到少；🔥 人氣店、自己按過的標 ❤、列出想吃的人
function renderWish(){
  const items=[];
  DAYS.forEach((d,di)=>d.foods.forEach((f,fi)=>{const k=fk(di,fi), n=wants.count(k); if(n>0) items.push({di,f,k,n});}));
  items.sort((a,b)=>b.n-a.n);
  document.getElementById("wishEmpty").hidden=items.length>0;
  document.getElementById("wishlist").innerHTML=items.map(({di,f,k,n})=>
    `<li><button data-d="${di}" class="${isHot(k)?"hot":""}"><span class="cnt">${n} 人</span>${isHot(k)?"🔥 ":""}${wants.has(k)?'<span class="mine" aria-label="我也想吃">❤ </span>':""}${esc(f.name)}<small>Day ${di+1} ${esc(DAYS[di].city)}</small><small class="who">${wants.names(k).map(esc).join("、")}</small></button></li>`).join("");
  document.querySelectorAll("#wishlist button").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.d,true)));
  const p=wants.people().length, me=Counter.myName();
  document.getElementById("wishMeta").innerHTML=
    (p?`目前 ${p} 位同學參與；🔥＝超過一半的人想吃。`:"")+
    (me?`　你是 <b>${esc(me)}</b>（<button type="button" class="rename" id="rename">改名</button>）`:"");
  const rn=document.getElementById("rename");
  if(rn) rn.onclick=()=>{Counter.askName(); refreshWants();};
}

// 只更新當天美食卡片上的按鈕與人數（不重畫整個面板，別人按讚時畫面不會跳）
function paintWants(){
  document.querySelectorAll("#panel .food").forEach(card=>{
    const k=card.dataset.k, on=wants.has(k), n=wants.count(k);
    card.classList.toggle("liked",on);
    const b=card.querySelector(".like");
    b.setAttribute("aria-pressed",on); b.disabled=wants.busy(k);
    b.querySelector(".lt").textContent=on?"已想吃":"想吃";
    const w=card.querySelector(".wants");
    w.hidden=n===0; w.textContent=`${isHot(k)?"🔥 ":""}${n} 人想吃：${wants.names(k).join("、")}`;
  });
}
const refreshWants=()=>{paintWants(); updateStats(); renderWish();};
const toggleWant=k=>wants.toggle(k);
const wants=Counter.roster("wantBy/"+TRIP_ID,refreshWants);

function go(i,scroll){
  if(i<0||i>=DAYS.length) return;
  cur=i; renderDay(); highlight();
  if(scroll) document.getElementById("panel").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}

document.getElementById("reset").addEventListener("click",()=>{
  // 只清個人的行程勾選；想吃是大家共用的人數，要收回請到該店按一次「已想吃」
  if(!confirm("確定要清除我的行程勾選？")) return;
  store={...store,done:{}}; save(); renderDay(); updateStats();
});

buildProfile(); buildTabs(); go(0); updateStats(); renderWish();
</script>
