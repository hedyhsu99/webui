<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老同學，出發吧！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色系與字型沿用行程頁，兩頁看起來是同一個網站 */
:root{
  --paper:#eef0ec; --card:#f8f9f6; --ink:#1f2a36; --muted:#5b6671; --line:#d2d8d1;
  --momiji:#b3362b; --momiji-soft:#f3dcd7; --gold:#b98f2e;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141a20; --card:#1b232b; --ink:#e5e9e3; --muted:#9ba6ae; --line:#2c363f;
    --momiji:#e2654f; --momiji-soft:#3a2522; --gold:#d8b45a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141a20; --card:#1b232b; --ink:#e5e9e3; --muted:#9ba6ae; --line:#2c363f;
  --momiji:#e2654f; --momiji-soft:#3a2522; --gold:#d8b45a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--momiji);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

.hero{padding:48px 0 28px}
.hero h1{font-family:var(--kai);font-weight:700;font-size:clamp(2rem,6vw,3rem);line-height:1.2;margin:0}
.hero p{margin:0;color:var(--muted)}

/* 表格欄位：# ／ 日期 ／ 編劇 ／ 劇本 ／ 上映日 ／ 票房
   表頭與每一列共用同一組欄寬，讓欄位上下對齊 */
.cols{display:grid;grid-template-columns:40px 96px 80px 1fr 84px 84px;gap:16px;align-items:center}

.thead{padding:0 20px 8px;font-size:.8rem;color:var(--muted);letter-spacing:.05em;border-bottom:1px solid var(--line)}

.trips{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.trip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;-webkit-tap-highlight-color:transparent}
.trip:hover{border-color:var(--momiji);transform:translateY(-2px)}
.trip[aria-current="true"]{border-color:var(--momiji);background:var(--momiji-soft);transform:none}

.no{font-family:var(--kai);font-size:1.3rem;color:var(--muted);font-variant-numeric:tabular-nums}
.date,.release{font-variant-numeric:tabular-nums;font-size:.92rem}
.who{font-size:.92rem}
.box{white-space:nowrap}
.trip{cursor:pointer}
.plan h2 a{color:inherit;text-decoration:none}

/* 按讚鈕：清單列與頂端資訊列共用 */
.like{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 12px;
  font:inherit;font-size:.92rem;font-variant-numeric:tabular-nums;color:var(--muted);
  background:transparent;border:1px solid var(--line);border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.like .heart{color:var(--momiji);font-size:1.05em;line-height:1}
.like .heart::before{content:"♡"}
.like[aria-pressed="true"]{color:var(--momiji);border-color:var(--momiji);background:var(--card)}
.like[aria-pressed="true"] .heart::before{content:"❤"}
.like:hover:not(:disabled){border-color:var(--momiji);color:var(--momiji)}
.like:disabled{cursor:default;opacity:.55}
.like.pop .heart{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.like.pop .heart{animation:none}}
.k{display:none}   /* 欄位名稱：桌面版由表頭顯示，手機版才露出 */

.plan{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;min-width:0}
.emo{font-size:2rem;line-height:1}
.plan h2{font-family:var(--kai);font-size:1.3rem;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.tag.season{border-color:var(--gold);color:var(--gold)}

/* 手機：六欄塞不下，改成三段——
   上：#1 · 日期 · 編劇　中：劇本　下：上映日 ＋ 票房 */
@media (max-width:760px){
  .thead{display:none}
  .trip.cols{grid-template-columns:auto auto 1fr;grid-template-areas:"no date who" "plan plan plan" "rel rel box";
    gap:6px 10px;padding:16px;align-items:baseline}
  .trip:hover{transform:none}
  .no{grid-area:no;font-size:1rem}
  .date{grid-area:date}
  .who{grid-area:who}
  .date,.who{font-size:.85rem;color:var(--muted)}
  .who::before{content:"· "}
  .plan{grid-area:plan;margin:6px 0 4px}
  .release{grid-area:rel;font-size:.85rem}
  .box{grid-area:box;text-align:right}
  .k{display:inline;color:var(--muted);margin-right:4px}
}

/* ── 行程顯示區 ── */
.viewer{margin-top:28px}
.viewer[hidden]{display:none}

/* 基本資訊列：捲動看行程時固定在畫面頂端 */
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;gap:10px;
  margin:0 -16px;padding:10px 16px;
  background:color-mix(in srgb,var(--paper) 96%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vinfo{flex:1;min-width:0;line-height:1.35}
.vinfo h2{font-family:var(--kai);font-size:1.2rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta b{color:var(--ink);font-weight:500}
.vbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:40px;height:40px;padding:0 12px;
  font:inherit;font-size:.85rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;
  cursor:pointer;text-decoration:none;white-space:nowrap}
.vbtn:hover{color:var(--momiji);border-color:var(--momiji)}
@media (max-width:760px){
  .vbtn{padding:0}
  .vbtn .lbl{display:none}   /* 手機只留圖示，把寬度讓給標題 */
  .vinfo h2{font-size:1.05rem}
}

/* 行程頁本身有左右留白，iframe 抵銷首頁的 16px 留白，避免手機上雙重內縮 */
.frame{display:block;width:calc(100% + 32px);margin:0 -16px;border:0;height:80vh;opacity:0;transition:opacity .25s}
.frame.ready{opacity:1}

footer{color:var(--muted);font-size:.82rem;padding:40px 0 32px;text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>老同學，出發吧！</h1>
  </header>

  <div class="thead cols" aria-hidden="true">
    <span>#</span><span>日期</span><span>編劇</span><span>劇本</span><span>上映日</span><span>票房</span>
  </div>
  <ul class="trips" id="list"></ul>

  <section class="viewer" id="viewer" hidden aria-live="polite">
    <div class="vbar">
      <div class="vinfo">
        <h2 id="vtitle"></h2>
        <div class="vmeta" id="vmeta"></div>
      </div>
      <button type="button" class="like" id="vlike" aria-pressed="false"><span class="heart" aria-hidden="true"></span><span class="n">—</span></button>
      <a class="vbtn" id="vopen" target="_blank" rel="noopener" title="在新分頁開啟">↗<span class="lbl">新分頁</span></a>
      <button class="vbtn" type="button" id="vclose" title="收合">✕<span class="lbl">收合</span></button>
    </div>
    <iframe class="frame" id="frame" title="行程內容"></iframe>
  </section>

  <footer>共 <span id="count">0</span> 部作品</footer>
</main>

<script src="counter.js"></script>
<script>
/*
 * 作品清單（每一趟旅行＝一部電影）：新增時只要在這裡加一筆，首頁會依編號由新到舊排列。
 *   no        編號（#），新作品接續最大號
 *   proposed  日期：提案日（YYYY-MM-DD）
 *   writer    編劇：提案人
 *   release   上映日：出發日，只知道月份就寫 YYYY-MM，確定日期寫 YYYY-MM-DD
 *   file      劇本：行程頁檔名（與 index.html 放在同一層）
 *   tags      第一個標籤會以金色顯示，建議放季節
 *   票房＝按讚數，存在 Firebase Realtime Database（透過 counter.js）
 */
const TRIPS = [
  {
    no: 1,
    proposed: "2026-09-30",
    writer: "江小靜",
    release: "2027-10",
    file: "hokuriku-autumn-2027.html",
    emoji: "🍁",
    title: "富山・飛驒・金澤",
    sub: "富山 → 高山 → 乘鞍岳 → 上高地 → 白川鄉 → 金澤",
    tags: ["秋季紅葉", "7 天 6 夜", "日本北陸"]
  }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ymd = s => s.replaceAll("-", "/");
const likeBtn = no => `<button type="button" class="like" data-like="${no}" aria-pressed="false"><span class="heart" aria-hidden="true"></span><span class="n">—</span></button>`;

// 新作品在最上面
const sorted = [...TRIPS].sort((a, b) => b.no - a.no);

// 整列可點（展開）；標題是真正的連結，鍵盤 Tab 到標題按 Enter、或 Ctrl＋點擊開新分頁都能用。
// 按讚鈕不能放在 <a> 裡（互動元素不可巢狀），所以列本身用 <div>
document.getElementById("list").innerHTML = sorted.map(t => `
  <li>
    <div class="trip cols" data-no="${t.no}">
      <span class="no">#${t.no}</span>
      <span class="date">${ymd(esc(t.proposed))}</span>
      <span class="who"><span class="k">編劇</span>${esc(t.writer)}</span>
      <div class="plan">
        <span class="emo" aria-hidden="true">${t.emoji}</span>
        <div>
          <h2><a href="${esc(t.file)}">${esc(t.title)}</a></h2>
          <div class="sub">${esc(t.sub)}</div>
          <div class="tags">
            ${t.tags.map((g, i) => `<span class="tag${i === 0 ? " season" : ""}">${esc(g)}</span>`).join("")}
          </div>
        </div>
      </div>
      <span class="release"><span class="k">上映</span>${ymd(esc(t.release))}</span>
      <span class="box"><span class="k">票房</span>${likeBtn(t.no)}</span>
    </div>
  </li>`).join("");

document.getElementById("count").textContent = TRIPS.length;

/*
 * ── 票房（按讚）──
 * 讀寫、即時更新、一台裝置讚一次、失敗還原都由共用的 counter.js 處理，這裡只負責畫面。
 * Firebase：/likes/t{編號} = 讚數；這台裝置按過哪幾部記在 localStorage 的 webui-liked
 */
const likes = Counter.group("likes", "webui-liked", paintLikes);

function paintLikes() {
  document.querySelectorAll("[data-like]").forEach(b => {
    const k = "t" + b.dataset.like, on = likes.has(k), n = likes.count(k);
    b.setAttribute("aria-pressed", on);
    b.querySelector(".n").textContent = n;
    b.disabled = likes.busy(k);
    b.title = on ? "收回讚" : "按讚";
    b.setAttribute("aria-label", `票房 ${n}，${b.title}`);
  });
}

function toggleLike(no) {
  likes.toggle("t" + no);
  if (likes.has("t" + no)) document.querySelectorAll(`[data-like="${no}"]`).forEach(b => {   // 按讚（不是收回）時愛心跳一下
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
  });
}
paintLikes();

/*
 * 就地展開：點清單列不換頁，而是把行程頁載入下方的 iframe。
 * 網址用 #編號 記住目前展開哪一部（例如 #1），重新整理或分享連結都會打開同一部；
 * 瀏覽器的上一頁／下一頁也能在「展開 ↔ 收合」之間切換。
 */
const viewer = document.getElementById("viewer");
const frame  = document.getElementById("frame");
const $title = document.getElementById("vtitle");
const $meta  = document.getElementById("vmeta");
const $open  = document.getElementById("vopen");
const $vlike = document.getElementById("vlike");
let current = null;   // 目前展開的作品編號
let sizer = null;     // 監看行程頁高度的 ResizeObserver

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function show(no, scroll) {
  const t = TRIPS.find(x => x.no === no);
  document.querySelectorAll(".trip").forEach(a =>
    a.setAttribute("aria-current", t && +a.dataset.no === no ? "true" : "false"));

  if (!t) {   // 收合
    current = null;
    viewer.hidden = true;
    frame.removeAttribute("src");
    return;
  }
  if (no !== current) {
    current = no;
    $title.textContent = `${t.emoji} ${t.title}`;
    $meta.innerHTML = `#${t.no}　編劇 <b>${esc(t.writer)}</b>　上映 <b>${ymd(esc(t.release))}</b>`;
    $vlike.dataset.like = t.no;
    paintLikes();
    $open.href = t.file;
    frame.classList.remove("ready");
    frame.style.height = "";
    frame.src = t.file;
  }
  viewer.hidden = false;
  if (scroll) viewer.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
}

/*
 * iframe 高度跟著行程頁內容走，整頁只有一條捲軸。
 * ⚠️ ResizeObserver 必須用「iframe 裡那個視窗」的建構子建立：
 *    用首頁的 ResizeObserver 去監看 iframe 內的元素不會觸發，
 *    高度只量到載入當下（字型還沒載完）就停住，iframe 內會多出一條捲軸。
 * 本機雙擊開檔（file://）時瀏覽器禁止讀取 iframe 內容，就維持 CSS 的固定 80vh、在框內捲動。
 */
frame.addEventListener("load", () => {
  if (sizer) { sizer.disconnect(); sizer = null; }
  if (!frame.getAttribute("src")) return;
  try {
    const win = frame.contentWindow, root = frame.contentDocument.documentElement;
    const fit = () => { frame.style.height = Math.ceil(root.getBoundingClientRect().height) + "px"; };
    root.style.overflow = "hidden";   // 高度已完全撐開，關掉 iframe 自己的捲軸
    sizer = new win.ResizeObserver(fit);
    sizer.observe(root);
    fit();
  } catch (e) {
    frame.style.height = "";
  }
  frame.classList.add("ready");
});

// 從網址 #編號 決定要展開哪一部
const fromHash = () => +location.hash.slice(1) || null;

document.getElementById("list").addEventListener("click", e => {
  const lb = e.target.closest("[data-like]");
  if (lb) { toggleLike(+lb.dataset.like); return; }   // 按讚不觸發展開
  const a = e.target.closest(".trip");
  if (!a) return;
  // 在標題連結上 Ctrl／Shift 點擊：保留瀏覽器原本行為（在新分頁開啟行程頁）
  if (e.target.closest("a") && (e.ctrlKey || e.metaKey || e.shiftKey)) return;
  e.preventDefault();
  const no = +a.dataset.no;
  if (no === current) {          // 再點一次同一列＝收合
    history.pushState(null, "", location.pathname);
    show(null);
  } else {
    history.pushState(null, "", "#" + no);
    show(no, true);
  }
});

$vlike.addEventListener("click", () => toggleLike(+$vlike.dataset.like));

document.getElementById("vclose").addEventListener("click", () => {
  history.pushState(null, "", location.pathname);
  show(null);
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
});

// 上一頁／下一頁、手動改網址
addEventListener("popstate", () => show(fromHash(), false));
addEventListener("hashchange", () => show(fromHash(), true));

// 開頁時若網址帶 #編號 就直接展開
if (fromHash()) show(fromHash(), true);
</script>
</body>
</html>
