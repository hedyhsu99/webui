<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的旅行行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 色系與字型沿用行程頁，兩頁看起來是同一個網站 */
:root{
  --paper:#eef0ec; --card:#f8f9f6; --ink:#1f2a36; --muted:#5b6671; --line:#d2d8d1;
  --momiji:#b3362b; --momiji-soft:#f3dcd7; --gold:#b98f2e;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141a20; --card:#1b232b; --ink:#e5e9e3; --muted:#9ba6ae; --line:#2c363f;
    --momiji:#e2654f; --momiji-soft:#3a2522; --gold:#d8b45a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141a20; --card:#1b232b; --ink:#e5e9e3; --muted:#9ba6ae; --line:#2c363f;
  --momiji:#e2654f; --momiji-soft:#3a2522; --gold:#d8b45a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--momiji);outline-offset:3px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

.hero{padding:48px 0 12px}
.hero h1{font-family:var(--kai);font-weight:700;font-size:clamp(2rem,6vw,3rem);line-height:1.2;margin:0 0 8px}
.hero p{margin:0;color:var(--muted)}

.year{font-family:var(--kai);font-size:1.3rem;color:var(--muted);margin:32px 0 12px;display:flex;align-items:center;gap:12px}
.year::after{content:"";flex:1;height:1px;background:var(--line)}

.trips{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.trip{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.trip:hover{border-color:var(--momiji);transform:translateY(-2px)}
.trip .emo{font-size:2.2rem;line-height:1}
.trip h2{font-family:var(--kai);font-size:1.35rem;margin:0;line-height:1.3}
.trip .sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.tag.season{border-color:var(--gold);color:var(--gold)}
.arrow{color:var(--muted);font-size:1.4rem}
.trip:hover .arrow{color:var(--momiji)}
@media (max-width:520px){
  .trip{grid-template-columns:auto 1fr;gap:14px;padding:16px}
  .arrow{display:none}
}

footer{color:var(--muted);font-size:.82rem;padding:40px 0 32px;text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>我的旅行行程</h1>
    <p>每一趟旅程的行程、路線與美食筆記。</p>
  </header>

  <div id="list"></div>

  <footer>共 <span id="count">0</span> 趟旅程</footer>
</main>

<script>
/*
 * 行程清單：新增行程時只要在這裡加一筆，首頁會自動依年份分組、由新到舊排列。
 *   file   行程頁檔名（與 index.html 放在同一層）
 *   year   分組用的年份
 *   month  同年內排序用（1~12）
 */
const TRIPS = [
  {
    file: "hokuriku-autumn-2027.html",
    emoji: "🍁",
    title: "富山・飛驒・金澤",
    sub: "富山 → 高山 → 乘鞍岳 → 上高地 → 白川鄉 → 金澤",
    year: 2027, month: 10,
    tags: ["秋季紅葉", "7 天 6 夜", "日本北陸"]
  }
];

// 由新到舊排序後依年份分組
const sorted = [...TRIPS].sort((a, b) => b.year - a.year || b.month - a.month);
const byYear = new Map();
for (const t of sorted) {
  if (!byYear.has(t.year)) byYear.set(t.year, []);
  byYear.get(t.year).push(t);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.getElementById("list").innerHTML = [...byYear].map(([year, trips]) => `
  <h3 class="year">${year}</h3>
  <ul class="trips">
    ${trips.map(t => `
      <li>
        <a class="trip" href="${esc(t.file)}">
          <span class="emo" aria-hidden="true">${t.emoji}</span>
          <div>
            <h2>${esc(t.title)}</h2>
            <div class="sub">${esc(t.sub)}</div>
            <div class="tags">
              ${t.tags.map((g, i) => `<span class="tag${i === 0 ? " season" : ""}">${esc(g)}</span>`).join("")}
            </div>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>`).join("")}
  </ul>`).join("");

document.getElementById("count").textContent = TRIPS.length;
</script>
</body>
</html>
